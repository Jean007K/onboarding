services:
  api:
    build: ./backend
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env
    environment:
      PORT: "8080"
      DB_PATH: /data/onboarding.db
      PUBLIC_APP_URL: http://localhost:3000
      CORS_ORIGIN: http://localhost:3000
    volumes:
      - ./data:/data

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - api
